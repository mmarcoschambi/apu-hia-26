version: 1
name: investment_committee_go_no_go

governance:
  plan_status: active
  phase: 1_freeze
  freeze_weeks: 6
  freeze_start_date: "2026-04-15"
  freeze_end_date: "2026-05-27"
  source_of_truth_combo: combo_pure_momentum
  allow_reoptimize: false
  allow_new_combos: false
  allow_re_torneo: false
  freeze_universe: true
  freeze_trading_hours: true

combo_decisions:
  combo_pullback_entry:
    status: INCUBATOR_OBSERVATIONAL
    capital_enabled: false
  combo_pure_momentum:
    status: PAPER_TRADING_ACTIVE
    capital_paper_usd: 100000
  combo_aggressive_momentum:
    status: NO_GO
    archived_operationally: true
    notes: "Descartado por colapso en 2024 y dependencia de regimen."

walk_forward:
  min_valid_folds: 2
  min_positive_folds: 2
  min_sharpe_mean: 0.75
  min_sharpe_min: 0.25
  min_pf_mean: 1.20
  min_pf_min: 1.00
  min_trades_per_fold: 50
  folds_primary_evidence: [2023, 2024, 2025]
  folds_stress_evidence: [2022]
  insufficient_evidence_action: HOLD_NO_GO

cost_sensitivity:
  baseline_scenario_label: optimizer_base
  baseline_roundtrip_bps: 20
  require_sanity_issues_empty: true
  require_non_constant_total_return: true
  require_non_constant_sharpe_pf: true

paper_trading:
  min_weeks: 4
  max_weeks: 6
  min_total_trades_for_decision: 30
  min_trades_per_week: 5
  min_profit_factor: 1.25
  min_win_rate: 0.45
  max_drawdown_period_pct: 15.0
  max_scanner_backtest_divergence_pct: 15.0
  require_slippage_real_lte_modeled_plus_margin: true
  modeled_slippage_margin_bps: 5

deployment:
  initial_risk_budget_pct: 10
  initial_risk_budget_pct_max: 20
  scale_step_pct: 10
  scale_frequency: weekly
  kill_switch_window:
    mode: rolling
    min_trades: 20
    min_weeks: 4
  kill_switch:
    min_profit_factor: 1.00
    max_drawdown_pct: 20.0
    max_scanner_backtest_divergence_pct: 15.0
  require_all_checks_green: true
