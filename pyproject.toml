[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "momentum-v2"
version = "0.1.0"
description = "Advanced momentum trading system using vectorbt and finviz."
authors = [
    { name = "Marcos" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.23.0",
    "numba>=0.56.0",
    "vectorbt>=0.28.2",
    "yfinance",
    "finvizfinance",
    "SQLAlchemy",
    "python-telegram-bot",
    "streamlit",
    "scipy",
    "pyarrow",
    "optuna",
    "scikit-learn",
    "plotly",
    "matplotlib",
    "duckdb",
    "polars>=1.0",
    "lightgbm",
    "psutil",
    "python-dotenv",
    "colorlog",
    "loguru",
    "openbb",
    "rich"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "black",
    "flake8"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    "archive",
    "scripts",
    "experiments",
    "scratch",
    "docs",
    ".git",
    ".venv",
    ".pytest_cache"
]