events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Upstream n8n service en red interna
    upstream n8n_backend {
        server n8n-automation:5678;
    }

    server {
        listen 80;
        server_name localhost;

        # Logs
        access_log /var/log/nginx/pmai_access.log;
        error_log  /var/log/nginx/pmai_error.log warn;

        location / {
            proxy_pass http://n8n_backend;
            proxy_http_version 1.1;

            # Soporte esencial de WebSockets para el canvas visual de n8n
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Cabeceras de host y cliente
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Deshabilitar buffering para streaming de ejecuciones
            proxy_buffering off;
            proxy_cache_bypass $http_upgrade;
            chunked_transfer_encoding off;
        }

        # Healthcheck endpoint para el Gateway
        location /healthz {
            return 200 '{"status":"healthy","service":"nginx-gateway"}';
            add_header Content-Type application/json;
        }
    }
}
