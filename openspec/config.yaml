# openspec/config.yaml
# Auto-generated by sdd-init for momentum-v2
schema: spec-driven

context: |
  Tech stack: Python 3.10+ · vectorbt · LightGBM · Optuna · pandas · Streamlit
  Architecture: Clean modular layout under src/ — signals, backtest, data, ml, optimization,
    strategies, indicators, filters, risk, analytics, ui, etc.
  Testing: pytest (unit, integration, regression, E2E via Playwright).
    Ruff linter (E/F/I/W, line-length 100, ignore E501), Black formatter (optional dev dep).
  Style: Type hints mandatory, docstrings (purpose/params/return).
    Comment language: Spanish, code language: English.
    Sensitive modules: src/backtest/ and src/data/ require explicit authorization.
  Build: setuptools via pyproject.toml at root.

strict_tdd: true

testing:
  strict_tdd: true
  runner: pytest
  test_command: PYTHONPATH=. pytest
  lint_command: ruff check .
  linter: ruff
  formatter: black
  type_checker: null
  coverage: null
  test_layers:
    - unit
    - integration
    - regression
    - end-to-end
  config_path: pyproject.toml
  environment: python3

rules:
  proposal:
    rules:
      - Include quantitative success criteria matching baseline (Return >= 96%, MDD <= -36%)
      - Reference affected modules and risk assessment
      - State rollback plan for risky changes
  specs:
    rules:
      - Use Given/When/Then for scenarios
      - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
      - Reference baseline metrics where applicable
  design:
    rules:
      - Include sequence diagrams for complex flows
      - Document architecture decisions with rationale (ADR format)
      - Reference existing patterns in src/
  tasks:
    rules:
      - Group by phase, use hierarchical numbering
      - Keep tasks completable in one session
      - Reference spec requirement IDs
  apply:
    tdd: true
    test_command: PYTHONPATH=. pytest
    rules:
      - Follow existing code patterns (clean modular, type-hinted)
      - Run affected test module before committing
      - PROHIBITED: modifying src/backtest/ or src/data/ without explicit authorization
  verify:
    test_command: PYTHONPATH=. pytest
    build_command: ""
    coverage_threshold: 0
    rules: []
  archive:
    rules:
      - Warn before merging destructive deltas
      - Archive directory: openspec/changes/archive/YYYY-MM-DD-{change-name}/
