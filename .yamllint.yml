# yamllint config - PMA-Docker 2026
extends: default
rules:
  line-length:
    max: 160
    level: warning
  truthy:
    allowed-values: ['true', 'false', 'on', 'off']
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  indentation:
    spaces: 2
    indent-sequences: consistent
  document-start: disable
  empty-lines:
    max: 2
    max-start: 0
    max-end: 1
  braces:
    max-spaces-inside: 1
ignore: |
  .codegraph/
  backups/
  node_modules/
